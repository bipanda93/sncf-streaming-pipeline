services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: sncf-kafka
    ports:
      - "9092:9092"   # listener interne (réseau docker, utilisé par kafka-ui)
      - "9094:9094"   # listener externe (depuis ta machine, ce que le producer Python utilise)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: sncf-kafka-ui
    ports:
      - "8080:8080"   # http://localhost:8080 -- pour visualiser les topics/messages
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
    depends_on:
      - kafka

  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: sncf-airflow
    depends_on:
      - kafka
    environment:
      # Adresse interne au réseau Docker -- pas localhost:9094 (ça, c'est
      # uniquement valable depuis ta machine, pas depuis un conteneur).
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PYTHONPATH: /opt/airflow/project
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./:/opt/airflow/project
    working_dir: /opt/airflow/project
    ports:
      - "8081:8080"   # 8080 déjà pris par kafka-ui
    command: standalone
