name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  dag-tests:
    runs-on: ubuntu-24.04

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Installer Airflow (même version que Dockerfile.airflow)
        run: >
          pip install "apache-airflow==3.3.1" apache-airflow-providers-standard pytest
          --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-3.3.1/constraints-3.12.txt"

      - name: Tester le chargement des DAGs
        run: pytest tests/test_dags.py -v

  unit-tests:
    runs-on: ubuntu-24.04

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Installer les dépendances des tests
        run: pip install requests==2.32.3 python-dotenv==1.0.1 confluent-kafka==2.5.0 pytest==9.2.0

      - name: Lancer les tests unitaires
        run: pytest tests/ --ignore=tests/test_dags.py -v

  terraform-validate:
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: infra/terraform

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Terraform (même version qu'en local)
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"

      - name: Vérifier le formatage
        run: terraform fmt -check -recursive

      - name: Initialiser sans backend ni connexion Azure
        run: terraform init -backend=false

      - name: Valider la configuration
        run: terraform validate

  lint:
    runs-on: ubuntu-24.04

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Installer ruff (même version qu'en local)
        run: pip install "ruff==0.17.1"

      - name: Vérifier le code Python
        run: ruff check src/ dags/ tests/

  docker-build:
    runs-on: ubuntu-24.04

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Construire l'image Airflow (sans push)
        run: docker build -f Dockerfile.airflow -t sncf-airflow:ci .

      - name: Vérifier Java dans l'image (requis par PySpark)
        run: docker run --rm --entrypoint java sncf-airflow:ci -version

      - name: Vérifier les dépendances Python dans l'image
        run: >
          docker run --rm --entrypoint python sncf-airflow:ci -c
          "import pyspark, delta, airflow; print('pyspark', pyspark.__version__, '| airflow', airflow.__version__)"

  secret-scan:
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Récupérer le code (historique complet)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Chercher des secrets dans les commits
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  compose-validate:
    runs-on: ubuntu-24.04

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Valider docker-compose.yml
        env:
          ANTHROPIC_API_KEY: bidon
        run: docker compose config --quiet

  notify-slack:
    runs-on: ubuntu-24.04
    needs: [dag-tests, unit-tests, lint, secret-scan, terraform-validate, compose-validate, docker-build, docs-build]
    if: always() && github.actor != 'dependabot[bot]'

    steps:
      - name: Notifier Slack
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "${{ contains(needs.*.result, 'failure') && 'CI en échec' || 'CI verte' }} sur ${{ github.repository }} (${{ github.ref_name }}) : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
  docs-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7
      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Installer MkDocs
        run: pip install -r requirements-docs.txt
      - name: Construire le site (strict)
        run: mkdocs build --strict
