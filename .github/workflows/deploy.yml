# Terraform -- plan manuel uniquement.
#
# Historique : jusqu'au 21/10/2026, ce workflow lançait un plan automatique
# sur chaque PR touchant infra/terraform/, et proposait apply/destroy en
# déclenchement manuel (décision du 19/08, après l'incident du 18/08 :
# voir notes/incidents_2026-08-18.md).
#
# Pourquoi apply/destroy sont désactivés : le projet n'a pas de backend
# distant, le state Terraform est local. Un runner GitHub part sans state :
# un apply créerait les ressources Azure puis perdrait le state à la fin du
# run, et plus aucun destroy ne pourrait les retrouver (ressources orphelines
# facturées). Apply et destroy se font donc uniquement en local.
#
# Pour les réactiver : configurer un backend azurerm (Storage Account +
# container pour le state), puis remettre les jobs ci-dessous.
#
# Pourquoi le plan n'est plus automatique : sans state partagé, il annonce
# la création de toutes les ressources, ce qui ne reflète pas l'état réel.
# La validation automatique du code Terraform (fmt, validate, sans secret)
# est faite par le job terraform-validate de ci.yml.
#
# Secrets requis pour le plan manuel (GitHub -> Settings -> Secrets and
# variables -> Actions, jamais dans ce fichier) :
#   ARM_CLIENT_ID, ARM_CLIENT_SECRET, ARM_TENANT_ID, ARM_SUBSCRIPTION_ID

name: Terraform (manuel)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
  ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}

jobs:
  terraform-plan:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Installer Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -no-color

  # Jobs désactivés tant que le state est local (voir en-tête) :
  #
  # terraform-apply:
  #   environment: production
  #   ...
  #   run: terraform apply -auto-approve
  #
  # terraform-destroy:
  #   environment: production
  #   ...
  #   run: terraform destroy -auto-approve
